name: sovlend

services:
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SOVLEND_DOMAIN: ${SOVLEND_DOMAIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY}
      CURRENCYFREAKS_API_KEY: ${CURRENCYFREAKS_API_KEY}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY}
      FREECRYPTO_API_KEY: ${FREECRYPTO_API_KEY}
      FREECRYPTO_API_BASE_URL: ${FREECRYPTO_API_BASE_URL}
      LEGACY_BASE_URL: ${LEGACY_BASE_URL}
      LEGACY_TENANT_ID: ${LEGACY_TENANT_ID}
      LEGACY_USERNAME: ${LEGACY_USERNAME}
      LEGACY_PASSWORD: ${LEGACY_PASSWORD}
      MIGRATION_ARCHIVE_DIR: ${MIGRATION_ARCHIVE_DIR}
      BLINK_API_URL: ${BLINK_API_URL}
      BLINK_API_KEY: ${BLINK_API_KEY}
      BLINK_WALLET_ID: ${BLINK_WALLET_ID}
      BLINK_WEBHOOK_SECRET: ${BLINK_WEBHOOK_SECRET}
      YOOLA_SMS_API_KEY: ${YOOLA_SMS_API_KEY}
      YOOLA_SMS_SENDER_ID: ${YOOLA_SMS_SENDER_ID}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    volumes: [document-uploads:/app/.uploads]
    security_opt: [no-new-privileges:true]

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SOVLEND_DOMAIN: ${SOVLEND_DOMAIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY}
      CURRENCYFREAKS_API_KEY: ${CURRENCYFREAKS_API_KEY}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY}
      FREECRYPTO_API_KEY: ${FREECRYPTO_API_KEY}
      FREECRYPTO_API_BASE_URL: ${FREECRYPTO_API_BASE_URL}
      LEGACY_BASE_URL: ${LEGACY_BASE_URL}
      LEGACY_TENANT_ID: ${LEGACY_TENANT_ID}
      LEGACY_USERNAME: ${LEGACY_USERNAME}
      LEGACY_PASSWORD: ${LEGACY_PASSWORD}
      MIGRATION_ARCHIVE_DIR: ${MIGRATION_ARCHIVE_DIR}
      BLINK_API_URL: ${BLINK_API_URL}
      BLINK_API_KEY: ${BLINK_API_KEY}
      BLINK_WALLET_ID: ${BLINK_WALLET_ID}
      BLINK_WEBHOOK_SECRET: ${BLINK_WEBHOOK_SECRET}
      YOOLA_SMS_API_KEY: ${YOOLA_SMS_API_KEY}
      YOOLA_SMS_SENDER_ID: ${YOOLA_SMS_SENDER_ID}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, egress]
    volumes: [document-uploads:/app/.uploads]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend, devhost]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6380:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend, devhost]
    security_opt: [no-new-privileges:true]

  migrate:
    build: { context: ., target: worker }
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SOVLEND_DOMAIN: ${SOVLEND_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  backup:
    build: ./infra/backup
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    volumes: [backup-cache:/var/cache/restic]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  backup-cache:
  document-uploads:

networks:
  frontend:
  egress:
  backend:
    internal: true
  devhost:
